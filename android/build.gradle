buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['BearoundReactSdk_' + name]
  }

  repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["BearoundReactSdk_" + name]).toInteger()
}

android {
  namespace "com.bearoundreactsdk"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

// Local native artifact (development only, opt-in). With BEAROUND_APP_PRESENCE_LOCAL=1 the
// module compiles against a locally built native AAR (BEAROUND_NATIVE_AAR_PATH, absolute)
// instead of the published JitPack tag, so the app presence API can be exercised before a
// native release exists. Without the variable nothing below changes the published pin.
// The AAR is compileOnly here because an AAR cannot embed a local AAR (bundleAar rejects
// it); the host app adds the same file to its runtime (see example/android/app).
// See scripts/app-presence-local-native.sh.
def bearoundAarHasAppPresence(File aar) {
  def zip = new java.util.zip.ZipFile(aar)
  try {
    def classesEntry = zip.getEntry("classes.jar")
    if (classesEntry == null) return false
    def jar = new java.util.zip.ZipInputStream(zip.getInputStream(classesEntry))
    try {
      def entry
      while ((entry = jar.nextEntry) != null) {
        if (entry.name == "io/bearound/sdk/models/AppPresenceConfiguration.class") return true
      }
      return false
    } finally {
      jar.close()
    }
  } finally {
    zip.close()
  }
}

def bearoundLocalNativeAar = null
if (System.getenv("BEAROUND_APP_PRESENCE_LOCAL") == "1") {
  def aarPath = System.getenv("BEAROUND_NATIVE_AAR_PATH")
  def aarFile = aarPath ? new File(aarPath) : null
  if (aarFile == null || !aarFile.isAbsolute() || !aarFile.isFile()) {
    throw new GradleException("BEAROUND_APP_PRESENCE_LOCAL=1 requires BEAROUND_NATIVE_AAR_PATH to be an absolute path to an existing native AAR (got '${aarPath}').")
  }
  if (!bearoundAarHasAppPresence(aarFile)) {
    throw new GradleException("Native AAR ${aarPath} does not contain the app presence API; build it from a native SDK that has it.")
  }
  bearoundLocalNativeAar = aarFile
  logger.lifecycle("BeAround native: local AAR ${aarFile}")
}

dependencies {
  implementation "com.facebook.react:react-android"
  if (bearoundLocalNativeAar != null) {
    compileOnly files(bearoundLocalNativeAar)
    testImplementation files(bearoundLocalNativeAar)
    // A file dependency carries no POM: declare the native SDK runtime dependencies
    // explicitly, with the versions from bearound-android-sdk/sdk/build.gradle.
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    return
  }
  // Exact pin, kept in lockstep with the iOS podspec dep (same native release).
  // v3.6.2 adds the persisted detection log with app-state tagging
  // (getDetectionLogJson/clearDetectionLog, 1:1 with iOS), on top of the 3.6.x
  // line (telemetry handoff, ghost-beacon fixes, scan watchdog).
  implementation 'com.github.Bearound:bearound-android-sdk:v3.16.0'
}
